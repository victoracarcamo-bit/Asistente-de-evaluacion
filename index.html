<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Evaluación IA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            BrainCircuit, Settings, FileSpreadsheet, FileText, ChevronDown, CheckCircle2, 
            AlertCircle, Download, Printer, GraduationCap, X, Target, AlignLeft, Info, 
            ListChecks, UserPlus, Save, SlidersHorizontal, Sparkles, Loader2, BookText, 
            History, Eye, Trash2
        } = window.lucide;

        const codigosPIE = [
            { id: 'S/C', desc: 'Sin Adecuación Curricular' },
            { id: 'C1', desc: 'Modificación de la actividad o instrumento (disminución ítems, indicadores o solicitudes)' },
            { id: 'C2', desc: 'Extensión de tiempo en la ejecución' },
            { id: 'C3', desc: 'Mediación de la evaluación: lectura de preguntas, instrucciones en forma personalizada' },
            { id: 'C4', desc: 'Mediación de la respuesta' },
            { id: 'C5', desc: 'Monitoreo en la ejecución de la actividad o evaluación' },
            { id: 'C6', desc: 'Supervisión al momento de entregar la actividad o instrumento' },
            { id: 'C7', desc: 'Otro procedimiento (especificar)' }
        ];

        const CustomDialog = ({ isOpen, title, message, type = 'info', onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-neutral-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-all animate-in zoom-in-95">
                        <div className="flex flex-col items-center text-center gap-3">
                            {type === 'error' ? (
                                <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-500"><AlertCircle size={24} /></div>
                            ) : type === 'confirm' ? (
                                <div className="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-500"><Info size={24} /></div>
                            ) : (
                                <div className="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-500"><Info size={24} /></div>
                            )}
                            <h3 className="text-lg font-bold text-neutral-800">{title}</h3>
                            <p className="text-sm text-neutral-600 mb-2">{message}</p>
                            
                            <div className="flex gap-3 w-full mt-2">
                                {type === 'confirm' && (
                                    <button onClick={onCancel} className="flex-1 py-2.5 bg-neutral-100 text-neutral-600 rounded-xl font-bold hover:bg-neutral-200 transition-colors">
                                        Cancelar
                                    </button>
                                )}
                                <button onClick={onConfirm} className={`flex-1 py-2.5 text-white rounded-xl font-bold transition-colors ${type === 'error' ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                    {type === 'confirm' ? 'Aceptar' : 'Entendido'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // Estado del Dialog (Alerts/Confirms)
            const [dialogConfig, setDialogConfig] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null, onCancel: null });
            const showAlert = (message, type = 'info', title = 'Información') => setDialogConfig({ isOpen: true, title, message, type, onConfirm: () => setDialogConfig(prev => ({...prev, isOpen: false})), onCancel: null });
            const showConfirm = (message, onConfirmCallback, title = 'Confirmar Acción') => setDialogConfig({ isOpen: true, title, message, type: 'confirm', onConfirm: () => { onConfirmCallback(); setDialogConfig(prev => ({...prev, isOpen: false})); }, onCancel: () => setDialogConfig(prev => ({...prev, isOpen: false})) });

            const [activeTab, setActiveTab] = useState('config');
            const [isGenerating, setIsGenerating] = useState(false);
            const [tipoInstrumento, setTipoInstrumento] = useState('rubrica'); 

            // API Key
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [showApiInput, setShowApiInput] = useState(!localStorage.getItem('gemini_api_key'));

            const [curriculumParams, setCurriculumParams] = useState({
                curso: '3° Básico',
                asignatura: 'Música',
                unidad: 'Unidad 1',
                objetivo: 'Interpretar repertorio',
                tipoProducto: 'Interpretación Musical'
            });

            // Estados Evaluación
            const [datosAlumno, setDatosAlumno] = useState({ nombre: '', rut: '', fecha: new Date().toISOString().split('T')[0] });
            const [codigoAdecuacion, setCodigoAdecuacion] = useState('S/C');
            const [detalleAdecuacion, setDetalleAdecuacion] = useState('');
            const [comentarioFeedback, setComentarioFeedback] = useState('');
            const [resultadosReporte, setResultadosReporte] = useState([]);

            const [rubricaGrid, setRubricaGrid] = useState({
                headers: ['Criterio', 'Nivel A', 'Nivel B', 'Nivel C'],
                rows: [
                    ['Afinación', 'Ejecuta todas las notas con afinación precisa a lo largo de toda la obra.', 'Ejecuta la mayoría de las notas con afinación correcta, con errores mínimos, en menos de la mitad de la obra.', 'Presenta dificultades constantes, en gran parte de la obra, para tocar las notas afinadas.'],
                    ['Ritmo', 'Mantiene el ritmo de la canción de forma precisa y constante durante toda la pieza.', 'Mantiene el ritmo en menos de la mitad de la canción, con algunas imprecisiones menores.', 'Dificultades notables para seguir el ritmo o respetar las duraciones en gran parte de la ejecución.']
                ]
            });
            const [seleccionesRubrica, setSeleccionesRubrica] = useState({});

            const [cotejoIndicadores, setCotejoIndicadores] = useState([
                { texto: 'Mantiene una postura adecuada y manos cubriendo orificios correctamente en toda la ejecución.', puntaje: 5 },
                { texto: 'Mantiene el ritmo de la canción de forma precisa y constante durante toda la pieza.', puntaje: 5 }
            ]);
            const [seleccionesCotejo, setSeleccionesCotejo] = useState({});

            const [escalaIndicadores, setEscalaIndicadores] = useState([
                { texto: 'Ejecuta todas las notas con afinación precisa a lo largo de toda la obra.' },
                { texto: 'Articula cada nota con claridad y definición, durante toda la ejecución.' }
            ]);
            const [escalaColumnas, setEscalaColumnas] = useState([
                { nombre: 'Siempre', puntaje: 3 }, { nombre: 'A veces', puntaje: 2 }, { nombre: 'Nunca', puntaje: 0 }
            ]);
            const [seleccionesEscala, setSeleccionesEscala] = useState({});

            const llamarIA = async (prompt, instruccion) => {
                if (!apiKey) {
                    showAlert("Por favor, ingresa tu API Key de Gemini en la configuración.", "error", "API Key faltante");
                    return null;
                }
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: instruccion }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    
                    if (!response.ok) throw new Error("Error en la respuesta de la API");
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    return text ? JSON.parse(text) : null;
                } catch (error) {
                    console.error("Error al llamar a la IA:", error);
                    showAlert("Hubo un error al comunicarse con la IA. Verifica tu API Key y tu conexión.", "error", "Error de IA");
                    return null;
                }
            };

            const generarRubricaIA = async () => {
                if (!curriculumParams.curso) { showAlert("Faltan datos curriculares.", "error"); return; }
                setIsGenerating(true);
                
                const prompt = `Actúa como un experto en evaluación educativa y el Currículum Nacional de Chile. Genera una Rúbrica.
Contexto: Curso: ${curriculumParams.curso}, Asignatura: ${curriculumParams.asignatura}, Unidad: ${curriculumParams.unidad}
Producto: ${curriculumParams.tipoProducto} | Objetivo: ${curriculumParams.objetivo}
Genera 4 Criterios y 4 Niveles de logro (Excelente, Bueno, Regular, Deficiente).

ESTILO Y LENGUAJE REQUERIDO (CRÍTICO):
1. Redacta los descriptores con alta precisión técnica y cuantificadores observables.
2. EJEMPLOS DE CUANTIFICADORES OBLIGATORIOS a utilizar:
   - Nivel A: "en toda la obra/ejecución", "el 100% de", "con total precisión", "a lo largo de toda la obra".
   - Nivel B: "en menos de la mitad del proceso", "la mayor parte", "con 1 o 2 errores menores", "con ajustes menores".
   - Nivel C/D: "presenta dificultades constantes", "en gran parte de la obra", "menos del 75%", "solo fragmentos aislados".
3. Céntrate en acciones concretas, EVITANDO POR COMPLETO juicios ambiguos (como "lo hace bien", "suficiente", "a veces", "regularmente").

DEBES RESPONDER EXCLUSIVAMENTE CON UN JSON VÁLIDO.
Formato esperado: Arreglo de arreglos. Ejemplo:
[
  ["Afinación", "Ejecuta todas las notas... en toda la obra.", "Ejecuta la mayoría... en menos de la mitad de la obra.", "Dificultades constantes... en gran parte de la obra.", "No logra..."],
  ["Ritmo", "...", "...", "...", "..."]
]`;

                const data = await llamarIA(prompt, "Eres un asistente estricto que solo responde con JSON válido, sin texto adicional.");
                
                if (data && Array.isArray(data)) {
                    setRubricaGrid({
                        headers: ['Criterio', 'Excelente', 'Bueno', 'Regular', 'Deficiente'],
                        rows: data.map(row => {
                            // Rellenar o recortar para asegurar 5 columnas exactas (Criterio + 4 niveles)
                            let newRow = [...row];
                            while(newRow.length < 5) newRow.push("");
                            return newRow.slice(0, 5);
                        })
                    });
                    setTipoInstrumento('rubrica');
                    showAlert("Rúbrica generada aplicando el lenguaje técnico y cuantificadores solicitados.", "success", "¡Éxito!");
                }
                setIsGenerating(false);
            };

            const calcularPuntaje = () => {
                let total = 0;
                let maximo = 0;
                if (tipoInstrumento === 'rubrica') {
                    maximo = rubricaGrid.rows.length * (rubricaGrid.headers.length - 1);
                    Object.values(seleccionesRubrica).forEach(colIndex => {
                        total += (rubricaGrid.headers.length - 1 - (colIndex - 1));
                    });
                } else if (tipoInstrumento === 'cotejo') {
                    cotejoIndicadores.forEach((ind, i) => {
                        maximo += ind.puntaje;
                        if (seleccionesCotejo[i] === 'si') total += ind.puntaje;
                    });
                } else if (tipoInstrumento === 'escala') {
                    const maxPuntajeColumna = Math.max(...escalaColumnas.map(c => c.puntaje));
                    maximo = escalaIndicadores.length * maxPuntajeColumna;
                    Object.values(seleccionesEscala).forEach(colIndex => {
                        total += escalaColumnas[colIndex].puntaje;
                    });
                }
                const porcentaje = maximo > 0 ? ((total / maximo) * 100).toFixed(1) : 0;
                let nota = 1.0;
                if (maximo > 0) {
                    const exigencia = 0.6; 
                    const ptAprobacion = maximo * exigencia;
                    if (total < ptAprobacion) {
                        nota = 3.0 * (total / ptAprobacion) + 1.0;
                    } else {
                        nota = 3.0 * ((total - ptAprobacion) / (maximo - ptAprobacion)) + 4.0;
                    }
                }
                return { total, maximo, porcentaje, nota: Math.max(1.0, Math.min(7.0, nota)).toFixed(1) };
            };

            const guardarEvaluacion = () => {
                if (!datosAlumno.nombre.trim()) {
                    showAlert("Por favor, ingresa el nombre del estudiante.", "error", "Datos incompletos");
                    return;
                }
                const res = calcularPuntaje();
                const nuevaEval = {
                    id: Date.now(),
                    ...datosAlumno,
                    ...res,
                    codigoAdecuacion,
                    detalleAdecuacion,
                    instrumento: tipoInstrumento
                };
                setResultadosReporte([nuevaEval, ...resultadosReporte]);
                showAlert(`Evaluación de ${datosAlumno.nombre} guardada en el consolidado.`, "success", "Guardado Exitoso");
                
                // Limpiar form
                setDatosAlumno({ ...datosAlumno, nombre: '' });
                setSeleccionesRubrica({}); setSeleccionesCotejo({}); setSeleccionesEscala({});
                setCodigoAdecuacion('S/C'); setDetalleAdecuacion('');
            };

            const descargarPDF = () => {
                const element = document.getElementById('reporte-evaluacion');
                if (!element) return;
                
                element.classList.remove('hidden');
                const opt = {
                    margin: 15,
                    filename: `Reporte_${datosAlumno.nombre || 'Estudiante'}_${curriculumParams.asignatura}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
                };

                window.html2pdf().set(opt).from(element).save().then(() => {
                    element.classList.add('hidden');
                });
            };

            const renderTabConfig = () => (
                <div className="max-w-4xl mx-auto space-y-6 animate-in fade-in slide-in-from-bottom-4">
                    {showApiInput && (
                        <div className="bg-amber-50 border border-amber-200 p-5 rounded-2xl shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
                            <div>
                                <h3 className="font-bold text-amber-900 flex items-center gap-2"><Settings size={18}/> Configurar IA (Gemini)</h3>
                                <p className="text-xs text-amber-700 mt-1">Para generar rúbricas automáticamente, ingresa tu API Key gratuita.</p>
                            </div>
                            <div className="flex gap-2 w-full md:w-auto">
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Pega tu API Key aquí..." className="flex-1 md:w-64 p-2.5 text-sm rounded-lg border border-amber-300 outline-none focus:border-amber-500" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key', apiKey); setShowApiInput(false); showAlert("API Key guardada localmente.", "success"); }} className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors">Guardar</button>
                            </div>
                        </div>
                    )}

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-neutral-200">
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-xl font-black text-neutral-800 flex items-center gap-2"><Target className="text-indigo-600"/> Contexto Curricular</h2>
                            {!showApiInput && <button onClick={() => setShowApiInput(true)} className="text-xs text-neutral-400 hover:text-indigo-600 font-bold transition-colors"><Settings size={14} className="inline mr-1"/> Cambiar API Key</button>}
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label className="block text-xs font-bold text-neutral-500 uppercase mb-2">Curso</label><input type="text" className="w-full p-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" value={curriculumParams.curso} onChange={e => setCurriculumParams({...curriculumParams, curso: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-neutral-500 uppercase mb-2">Asignatura</label><input type="text" className="w-full p-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" value={curriculumParams.asignatura} onChange={e => setCurriculumParams({...curriculumParams, asignatura: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-neutral-500 uppercase mb-2">Unidad</label><input type="text" className="w-full p-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" value={curriculumParams.unidad} onChange={e => setCurriculumParams({...curriculumParams, unidad: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-neutral-500 uppercase mb-2">Tipo de Producto</label><input type="text" className="w-full p-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" value={curriculumParams.tipoProducto} onChange={e => setCurriculumParams({...curriculumParams, tipoProducto: e.target.value})} placeholder="Ej: Maqueta, Ensayo, Interpretación" /></div>
                            <div className="md:col-span-2"><label className="block text-xs font-bold text-neutral-500 uppercase mb-2">Objetivo de Aprendizaje / Temática</label><textarea rows="2" className="w-full p-3 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow resize-none" value={curriculumParams.objetivo} onChange={e => setCurriculumParams({...curriculumParams, objetivo: e.target.value})} /></div>
                        </div>

                        <div className="mt-8 pt-6 border-t border-neutral-100">
                            <h3 className="text-sm font-bold text-neutral-800 mb-4 flex items-center gap-2"><Sparkles className="text-amber-500"/> Generación con IA (Lenguaje Técnico)</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <button onClick={generarRubricaIA} disabled={isGenerating} className="flex flex-col items-center justify-center gap-3 bg-indigo-600 text-white p-5 rounded-2xl shadow-md hover:bg-indigo-700 transition-all hover:-translate-y-1 disabled:opacity-50">
                                    {isGenerating ? <Loader2 size={28} className="animate-spin" /> : <BrainCircuit size={28} />}
                                    <span className="font-bold text-sm text-center">Generar Rúbrica</span>
                                </button>
                                <button onClick={() => { setTipoInstrumento('cotejo'); setActiveTab('evaluar'); }} className="flex flex-col items-center justify-center gap-3 bg-white border border-neutral-200 text-neutral-700 p-5 rounded-2xl shadow-sm hover:border-indigo-300 transition-all hover:-translate-y-1">
                                    <ListChecks size={28} className="text-indigo-500" />
                                    <span className="font-bold text-sm text-center">Usar Lista de Cotejo</span>
                                </button>
                                <button onClick={() => { setTipoInstrumento('escala'); setActiveTab('evaluar'); }} className="flex flex-col items-center justify-center gap-3 bg-white border border-neutral-200 text-neutral-700 p-5 rounded-2xl shadow-sm hover:border-indigo-300 transition-all hover:-translate-y-1">
                                    <SlidersHorizontal size={28} className="text-indigo-500" />
                                    <span className="font-bold text-sm text-center">Usar Escala</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderTabEvaluar = () => {
                const resultados = calcularPuntaje();
                const isAdecuacionC7 = codigoAdecuacion === 'C7';
                
                return (
                <div className="max-w-6xl mx-auto space-y-6 animate-in fade-in slide-in-from-bottom-4">
                    
                    {/* Panel Superior Interactivo */}
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-neutral-200 flex flex-col lg:flex-row gap-6 items-start lg:items-center justify-between sticky top-4 z-30">
                        <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                            <div>
                                <label className="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Nombre del Estudiante</label>
                                <input type="text" placeholder="Ej: Juan Pérez" className="w-full p-2.5 text-sm bg-neutral-50 border border-neutral-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-neutral-800" value={datosAlumno.nombre} onChange={e => setDatosAlumno({...datosAlumno, nombre: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Fecha de Evaluación</label>
                                <input type="date" className="w-full p-2.5 text-sm bg-neutral-50 border border-neutral-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-neutral-600" value={datosAlumno.fecha} onChange={e => setDatosAlumno({...datosAlumno, fecha: e.target.value})} />
                            </div>
                            
                            {/* Selector de Códigos PIE Responsivo */}
                            <div className="sm:col-span-2 flex flex-col gap-1.5">
                                <label className="block text-[10px] font-bold text-neutral-500 uppercase flex items-center gap-1"><Info size={12}/> Adecuación Curricular (PIE)</label>
                                <div className="flex flex-col sm:flex-row gap-2">
                                    <select 
                                        className="p-2.5 text-sm bg-indigo-50 border border-indigo-200 text-indigo-900 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-medium flex-1 cursor-pointer truncate"
                                        value={codigoAdecuacion}
                                        onChange={e => setCodigoAdecuacion(e.target.value)}
                                    >
                                        {codigosPIE.map(c => (
                                            <option key={c.id} value={c.id} title={c.desc}>{c.id === 'S/C' ? c.desc : `${c.id} - ${c.desc}`}</option>
                                        ))}
                                    </select>
                                    {isAdecuacionC7 && (
                                        <input 
                                            type="text" 
                                            placeholder="Especificar procedimiento..." 
                                            className="w-full sm:w-1/2 p-2.5 text-sm bg-amber-50 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none placeholder-amber-400" 
                                            value={detalleAdecuacion} 
                                            onChange={e => setDetalleAdecuacion(e.target.value)} 
                                        />
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-4 shrink-0 w-full lg:w-auto h-full">
                            <div className="bg-neutral-50 border border-neutral-200 px-6 py-4 rounded-xl flex flex-col items-center justify-center flex-1 h-full min-h-[90px]">
                                <span className="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-1">Puntaje</span>
                                <span className="text-3xl font-black text-neutral-800 leading-none">{resultados.total} <span className="text-sm text-neutral-400 font-bold">/ {resultados.maximo}</span></span>
                            </div>
                            <div className={`px-8 py-4 rounded-xl flex flex-col items-center justify-center flex-1 h-full min-h-[90px] border ${parseFloat(resultados.nota) >= 4.0 ? 'bg-indigo-50 border-indigo-200' : 'bg-rose-50 border-rose-200'}`}>
                                <span className={`text-[10px] font-bold uppercase tracking-widest mb-1 ${parseFloat(resultados.nota) >= 4.0 ? 'text-indigo-600' : 'text-rose-600'}`}>Nota Auto</span>
                                <span className={`text-4xl font-black leading-none tracking-tighter ${parseFloat(resultados.nota) >= 4.0 ? 'text-indigo-700' : 'text-rose-700'}`}>{resultados.nota}</span>
                            </div>
                        </div>
                    </div>

                    {/* Tarjetas de Evaluación Compactas (Grid Layout sin Tablas HTML para evitar scroll horizontal) */}
                    <div className="w-full bg-transparent">
                        {tipoInstrumento === 'rubrica' && (
                            <div className="flex flex-col gap-3 w-full">
                                {rubricaGrid.rows.map((row, rowIndex) => (
                                    <div key={`eval-criterio-${rowIndex}`} className="bg-white border border-neutral-200 rounded-xl overflow-hidden shadow-sm">
                                        <div className="bg-neutral-50 p-3 border-b border-neutral-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <h4 className="font-black text-neutral-800 text-sm leading-snug break-words">{row[0] || `Criterio ${rowIndex + 1}`}</h4>
                                            <span className="bg-white border border-neutral-300 text-neutral-500 px-2 py-0.5 rounded text-[10px] font-bold shrink-0 self-start sm:self-auto uppercase tracking-wide">
                                                Máx {rubricaGrid.headers.length - 1} pts
                                            </span>
                                        </div>
                                        {/* CSS Grid Responsivo: Se adapta desde 1 columna (móvil) a múltiples (PC) */}
                                        <div className="p-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                                            {row.slice(1).map((cell, colIndex) => {
                                                const absoluteColIndex = colIndex + 1;
                                                const isSelected = seleccionesRubrica[rowIndex] === absoluteColIndex;
                                                const header = rubricaGrid.headers[absoluteColIndex];
                                                const pts = rubricaGrid.headers.length - 1 - colIndex;
                                                return (
                                                    <button
                                                        key={`eval-cell-${rowIndex}-${absoluteColIndex}`}
                                                        onClick={() => setSeleccionesRubrica({...seleccionesRubrica, [rowIndex]: absoluteColIndex})}
                                                        className={`w-full p-3 text-left border rounded-xl transition-all flex flex-col gap-1.5 outline-none min-h-[90px] ${isSelected ? 'border-indigo-500 bg-indigo-50 shadow-md ring-1 ring-indigo-500' : 'border-neutral-200 bg-white hover:border-indigo-200 hover:bg-neutral-50'}`}
                                                    >
                                                        <div className="flex justify-between items-center w-full mb-1">
                                                            <span className={`text-[11px] font-bold uppercase truncate pr-2 ${isSelected ? 'text-indigo-800' : 'text-neutral-500'}`}>{header}</span>
                                                            <span className={`text-[10px] font-black px-1.5 py-0.5 rounded shrink-0 ${isSelected ? 'bg-indigo-600 text-white' : 'bg-neutral-100 text-neutral-500'}`}>{pts} pts</span>
                                                        </div>
                                                        <span className={`text-xs leading-snug break-words ${isSelected ? 'text-indigo-900 font-medium' : 'text-neutral-600'}`}>{cell || 'Sin descriptor'}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tipoInstrumento === 'cotejo' && (
                            <div className="flex flex-col gap-3 w-full">
                                {cotejoIndicadores.map((ind, idx) => (
                                    <div key={`eval-cot-${idx}`} className={`bg-white border rounded-xl p-4 transition-all shadow-sm flex flex-col md:flex-row items-start md:items-center gap-4 ${seleccionesCotejo[idx] ? 'border-indigo-300 bg-indigo-50/50' : 'border-neutral-200'}`}>
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-[10px] font-bold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded">{ind.puntaje} pts</span>
                                            </div>
                                            <span className="font-bold text-sm text-neutral-800 leading-snug break-words">{ind.texto}</span>
                                        </div>
                                        <div className="flex gap-2 w-full md:w-auto shrink-0">
                                            <button onClick={() => setSeleccionesCotejo({...seleccionesCotejo, [idx]: 'si'})} className={`flex-1 md:w-24 py-2.5 rounded-lg text-xs font-black uppercase tracking-wide transition-all ${seleccionesCotejo[idx] === 'si' ? 'bg-indigo-600 text-white shadow-md' : 'bg-neutral-100 text-neutral-500 hover:bg-neutral-200'}`}>Logrado</button>
                                            <button onClick={() => setSeleccionesCotejo({...seleccionesCotejo, [idx]: 'no'})} className={`flex-1 md:w-24 py-2.5 rounded-lg text-xs font-black uppercase tracking-wide transition-all ${seleccionesCotejo[idx] === 'no' ? 'bg-rose-500 text-white shadow-md' : 'bg-neutral-100 text-neutral-500 hover:bg-neutral-200'}`}>No Logrado</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tipoInstrumento === 'escala' && (
                            <div className="flex flex-col gap-3 w-full">
                                {escalaIndicadores.map((ind, rowIndex) => (
                                    <div key={`eval-esc-${rowIndex}`} className={`bg-white border rounded-xl p-4 shadow-sm transition-all ${seleccionesEscala[rowIndex] !== undefined ? 'border-indigo-300 bg-indigo-50/30' : 'border-neutral-200'}`}>
                                        <h4 className="font-bold text-sm text-neutral-800 mb-3 leading-snug break-words">{ind.texto}</h4>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                                            {escalaColumnas.map((col, colIndex) => {
                                                const isSelected = seleccionesEscala[rowIndex] === colIndex;
                                                return (
                                                    <button 
                                                        key={`eval-esc-btn-${rowIndex}-${colIndex}`} 
                                                        onClick={() => setSeleccionesEscala({...seleccionesEscala, [rowIndex]: colIndex})} 
                                                        className={`w-full p-2.5 rounded-xl text-xs font-bold transition-all border flex flex-col items-center justify-center gap-1 outline-none min-h-[64px] ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white shadow-md' : 'bg-white border-neutral-200 text-neutral-600 hover:border-indigo-300 hover:bg-neutral-50'}`}
                                                    >
                                                        <span className="text-center leading-tight break-words">{col.nombre}</span>
                                                        <span className={`text-[10px] px-1.5 py-0.5 rounded ${isSelected ? 'bg-indigo-500 text-white font-medium' : 'bg-neutral-100 text-neutral-500'}`}>{col.puntaje} pts</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="flex gap-4">
                        <button onClick={() => {
                            if(Object.keys(seleccionesRubrica).length > 0 || Object.keys(seleccionesCotejo).length > 0 || Object.keys(seleccionesEscala).length > 0) {
                                showConfirm("¿Estás seguro de limpiar toda la evaluación actual?", () => {
                                    setSeleccionesRubrica({}); setSeleccionesCotejo({}); setSeleccionesEscala({});
                                    setCodigoAdecuacion('S/C'); setDetalleAdecuacion('');
                                });
                            }
                        }} className="px-6 py-3.5 rounded-xl border border-neutral-200 font-bold text-neutral-600 hover:bg-neutral-100 transition-colors text-sm">Limpiar</button>
                        <button onClick={descargarPDF} className="hidden md:flex flex-1 py-3.5 rounded-xl bg-white border border-indigo-200 text-indigo-700 font-bold hover:bg-indigo-50 transition-colors shadow-sm items-center justify-center gap-2 text-sm"><Printer size={18}/> Ver/Descargar PDF Individual</button>
                        <button onClick={guardarEvaluacion} className="flex-1 py-3.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition-colors shadow-md flex items-center justify-center gap-2 text-sm"><Save size={18}/> Guardar en Consolidado</button>
                    </div>
                </div>
                );
            };

            const renderTabReporte = () => (
                <div className="max-w-6xl mx-auto animate-in fade-in slide-in-from-bottom-4">
                    <div className="bg-white p-6 md:p-8 rounded-2xl border border-neutral-200 shadow-sm">
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h2 className="text-2xl font-black text-neutral-900 flex items-center gap-3"><History className="text-indigo-600" size={28} /> Consolidado de Evaluaciones</h2>
                                <p className="text-sm text-neutral-500 mt-1">Todas las evaluaciones guardadas en esta sesión.</p>
                            </div>
                            {resultadosReporte.length > 0 && (
                                <button onClick={() => showAlert("Función de exportar a Excel en desarrollo para esta demo.", "info")} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors border border-emerald-200">
                                    <FileSpreadsheet size={18} /> Exportar Notas
                                </button>
                            )}
                        </div>

                        {resultadosReporte.length === 0 ? (
                            <div className="text-center py-16 bg-neutral-50 rounded-2xl border-2 border-dashed border-neutral-200">
                                <History size={40} className="mx-auto text-neutral-300 mb-3" />
                                <p className="text-sm font-bold text-neutral-500">Aún no hay evaluaciones guardadas</p>
                            </div>
                        ) : (
                            <div className="border border-neutral-200 rounded-xl overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm whitespace-nowrap">
                                        <thead className="bg-neutral-50 border-b border-neutral-200 text-neutral-600">
                                            <tr>
                                                <th className="px-5 py-3 font-bold">Estudiante</th>
                                                <th className="px-5 py-3 font-bold">Fecha</th>
                                                <th className="px-5 py-3 font-bold text-center">PIE</th>
                                                <th className="px-5 py-3 font-bold text-center">Logro</th>
                                                <th className="px-5 py-3 font-bold text-center">Nota</th>
                                                <th className="px-5 py-3 font-bold text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-neutral-100">
                                            {resultadosReporte.map((res) => (
                                                <tr key={res.id} className="hover:bg-neutral-50 transition-colors">
                                                    <td className="px-5 py-3 font-bold text-neutral-800">{res.nombre}</td>
                                                    <td className="px-5 py-3 text-neutral-500">{res.fecha}</td>
                                                    <td className="px-5 py-3 text-center">
                                                        <span className={`px-2 py-1 rounded text-xs font-bold ${res.codigoAdecuacion === 'S/C' ? 'bg-neutral-100 text-neutral-500' : 'bg-amber-100 text-amber-700'}`}>
                                                            {res.codigoAdecuacion}
                                                        </span>
                                                    </td>
                                                    <td className="px-5 py-3 text-center font-medium">{res.porcentaje}%</td>
                                                    <td className="px-5 py-3 text-center">
                                                        <span className={`inline-block px-3 py-1 rounded-lg font-black ${parseFloat(res.nota) >= 4.0 ? 'bg-indigo-100 text-indigo-700' : 'bg-rose-100 text-rose-700'}`}>
                                                            {res.nota}
                                                        </span>
                                                    </td>
                                                    <td className="px-5 py-3 text-center">
                                                        <button onClick={() => {
                                                            showConfirm(`¿Deseas eliminar la evaluación de ${res.nombre}?`, () => {
                                                                setResultadosReporte(resultadosReporte.filter(r => r.id !== res.id));
                                                            });
                                                        }} className="text-neutral-400 hover:text-red-500 p-1.5 transition-colors">
                                                            <Trash2 size={16} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderReportePDF = () => {
                const resultados = calcularPuntaje();
                const adecObj = codigosPIE.find(c => c.id === codigoAdecuacion) || codigosPIE[0];
                const adecText = codigoAdecuacion === 'S/C' ? 'S/C (Sin Adecuación)' : 
                                 codigoAdecuacion === 'C7' ? `C7 - ${detalleAdecuacion || 'Otro (No especificado)'}` : 
                                 `${adecObj.id} - ${adecObj.desc}`;

                return (
                    <div id="reporte-evaluacion" className="hidden bg-white p-10 w-[800px] text-neutral-800 absolute top-[-9999px] left-[-9999px]">
                        <div className="border-b-4 border-indigo-600 pb-6 mb-6 flex justify-between items-end">
                            <div>
                                <h1 className="text-3xl font-black text-indigo-900 mb-2 uppercase tracking-tight">Reporte de Evaluación</h1>
                                <p className="text-sm text-neutral-500 font-bold tracking-wide">Decreto 67 - Mineduc</p>
                            </div>
                            <div className="text-right">
                                <p className="text-lg font-bold text-neutral-800">{curriculumParams.asignatura}</p>
                                <p className="text-sm text-neutral-500">{curriculumParams.curso}</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 mb-8 bg-neutral-50 p-6 rounded-xl border border-neutral-200">
                            <div><p className="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-1">Estudiante</p><p className="font-bold text-base text-neutral-900">{datosAlumno.nombre || '________________________'}</p></div>
                            <div><p className="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-1">Fecha</p><p className="font-bold text-base text-neutral-900">{datosAlumno.fecha}</p></div>
                            <div className="col-span-2 border-t border-neutral-200 pt-4 mt-2">
                                <p className="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-1">Adecuación Curricular (PIE)</p>
                                <p className="font-bold text-sm text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded inline-block border border-indigo-100">{adecText}</p>
                            </div>
                        </div>

                        <div className="mb-8">
                            <h3 className="text-sm font-bold text-indigo-900 border-b-2 border-indigo-100 pb-2 mb-4 uppercase tracking-wider">Resultados Oficiales</h3>
                            <div className="flex gap-4">
                                <div className="bg-white border border-neutral-200 p-5 rounded-xl flex-1 text-center shadow-sm">
                                    <p className="text-[10px] font-bold text-neutral-500 uppercase mb-2 tracking-widest">Puntaje Obtenido</p>
                                    <p className="text-3xl font-black text-neutral-900">{resultados.total} <span className="text-sm text-neutral-400">/ {resultados.maximo}</span></p>
                                </div>
                                <div className="bg-white border border-neutral-200 p-5 rounded-xl flex-1 text-center shadow-sm">
                                    <p className="text-[10px] font-bold text-neutral-500 uppercase mb-2 tracking-widest">Nivel de Logro</p>
                                    <p className="text-3xl font-black text-neutral-900">{resultados.porcentaje}%</p>
                                </div>
                                <div className={`p-5 rounded-xl flex-1 text-center border shadow-sm ${parseFloat(resultados.nota) >= 4.0 ? 'bg-indigo-50 border-indigo-200' : 'bg-rose-50 border-rose-200'}`}>
                                    <p className={`text-[10px] font-bold uppercase mb-2 tracking-widest ${parseFloat(resultados.nota) >= 4.0 ? 'text-indigo-600' : 'text-rose-600'}`}>Calificación</p>
                                    <p className={`text-4xl font-black ${parseFloat(resultados.nota) >= 4.0 ? 'text-indigo-700' : 'text-rose-700'}`}>{resultados.nota}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="text-center text-[10px] text-neutral-400 mt-16 pt-6 border-t border-neutral-200 font-medium">
                            Documento generado automáticamente por Asistente de Evaluación Educativa.
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-neutral-50 text-neutral-800">
                    <CustomDialog {...dialogConfig} />
                    
                    <header className="bg-white border-b border-neutral-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-inner"><GraduationCap size={20} strokeWidth={2.5} /></div>
                                <h1 className="font-black text-lg text-neutral-900 hidden sm:block tracking-tight">Asistente<span className="text-indigo-600">Eval</span></h1>
                            </div>
                            <nav className="flex bg-neutral-100 p-1 rounded-xl">
                                <button onClick={() => setActiveTab('config')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'config' ? 'bg-white text-indigo-700 shadow-sm ring-1 ring-neutral-200' : 'text-neutral-500 hover:text-neutral-700'}`}>1. Instrumento</button>
                                <button onClick={() => setActiveTab('evaluar')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'evaluar' ? 'bg-white text-indigo-700 shadow-sm ring-1 ring-neutral-200' : 'text-neutral-500 hover:text-neutral-700'}`}>2. Evaluar</button>
                                <button onClick={() => setActiveTab('reporte')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all hidden md:block ${activeTab === 'reporte' ? 'bg-white text-indigo-700 shadow-sm ring-1 ring-neutral-200' : 'text-neutral-500 hover:text-neutral-700'}`}>3. Consolidado</button>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 p-4 md:p-8 overflow-x-hidden">
                        {activeTab === 'config' && renderTabConfig()}
                        {activeTab === 'evaluar' && renderTabEvaluar()}
                        {activeTab === 'reporte' && renderTabReporte()}
                    </main>

                    {renderReportePDF()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
