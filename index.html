        const descargarArchivo = (blob, nombre) => {
            try {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.style.display = "none";
                a.href = url;
                a.download = nombre;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 150);
            } catch (error) {
                console.error("Error al descargar el archivo:", error);
            }
        };

                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            const sortedResultados = useMemo(() => {
                let sortableItems = [...resultados];
                if (sortConfig !== null && sortConfig.key) {
                    sortableItems.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];
                        
                        if (sortConfig.key === 'logro') {
                            aValue = a.maximo > 0 ? (a.puntaje / a.maximo) : 0;
                            bValue = b.maximo > 0 ? (b.puntaje / b.maximo) : 0;
                        } else if (typeof aValue === 'string') {
                            aValue = aValue.toLowerCase();
                            bValue = (bValue || '').toLowerCase();
                        }

                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });
                }

                // Obtenemos la key del entorno integrada
                const envApiKey = ""; 
                // Revisamos si el usuario proporcionó su propia API Key
                const userApiKey = localStorage.getItem('gemini_api_key');
                
                // Usamos la llave del usuario si existe, sino la integrada por defecto.
                const activeKey = userApiKey || envApiKey;
                
                // Si usamos la key del usuario, el modelo interno de preview "09-2025" no existirá en su proyecto público,
                // por lo tanto, usamos "gemini-2.5-flash" estandar. Si usamos la key del entorno, usamos el modelo de preview.
                const modelName = userApiKey ? "gemini-2.5-flash" : "gemini-2.5-flash-preview-09-2025";
                
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;
                
                let response;
                // Exponential backoff
                for (let i = 0; i < 5; i++) {
                    try {
                        response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: promptTexto }] }],
                                systemInstruction: { parts: [{ text: instruccionSistema }] }
                            })
                        });
                        if (response.ok) break;
                        // Si da error 400 (Bad Request), 403 (Forbidden), 404 (Not Found), no tiene sentido reintentar
                        if (response.status === 400 || response.status === 403 || response.status === 404) break; 
                    } catch (e) {
                        if (i === 4) throw e;
                        await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                    }
                }
                
                if (!response || !response.ok) {
                    let errorMsg = "Error desconocido";
                    try {
                        const errData = await response.json();
                        errorMsg = errData.error?.message || JSON.stringify(errData);
                    } catch(e) {
                        errorMsg = response ? await response.text() : "Fallo de red al intentar conectar";
                    }
                    console.error("Error de API:", errorMsg);
                    alert(`❌ Error al conectar con la IA.\n\nDetalle técnico: ${errorMsg.substring(0, 150)}...\n\nSi configuraste tu propia API Key, asegúrate de que sea correcta.`);
                    throw new Error('Error al conectar con la API de IA');
                }
                
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            };

                    const datosSimplificados = resultados.map(r => ({
                        estudiante: r.alumno,
                        nota: r.nota,
                        logro: Math.round((r.puntaje / r.maximo) * 100) + '%',
                        nivel_obtenido: r.nivel,
                        detalles_evaluados: r.detalles.map(d => ({criterio: d.criterio, categoria: d.categoria}))
                    }));

                    const prompt = `Actúa como un Coordinador Académico experto en análisis de datos educativos. Analiza los siguientes resultados de evaluaciones de todo un curso:
${JSON.stringify(datosSimplificados)}

Genera un reporte conciso estructurado estrictamente en 3 secciones cortas:
1. 🌟 Principal Fortaleza del Curso: Identifica patrones de criterios donde a la mayoría le fue muy bien.
2. 📉 Oportunidad de Mejora General: Identifica el criterio o área que más costó a nivel grupal.
3. 💡 Sugerencia Pedagógica: Recomienda una acción formativa o actividad rápida para hacer en la próxima clase y reforzar esa debilidad.

Responde con texto claro, usa emojis en titles de cada sección, y no incluyas asteriscos (**) de formato markdown. Sé directo y profesional.`;

                    const texto = await llamarIA(prompt, "Eres un analista de datos educativos enfocado en dar feedback útil a docentes.");
                    if (texto) {
                        setInsightText(texto);
                    } else {
                        setInsightText("No se pudo generar el análisis de patrones. Cierra esta ventana e intenta de nuevo.");
                    }
                } catch (e) {
                    console.error(e);
                    setInsightText("❌ Error de red al conectar con la Inteligencia Artificial.\n\nRevisa tu configuración de API Key y tu conexión a internet.");
                } finally {
                    setIsGeneratingInsights(false);
                }
            };


            const calcularNota = (puntaje, pIdeal, exig) => {
                const p = parseFloat(puntaje) || 0;
                const pi = parseFloat(pIdeal) || 1;
                const ex = parseFloat(exig) || 60;
                const pCorte = pi * (ex / 100);

                let nota;
                if (p < pCorte) { nota = (4.0 - 1.0) * (p / (pCorte || 1)) + 1.0; } 
                else { nota = (7.0 - 4.0) * ((p - pCorte) / ((pi - pCorte) || 1)) + 4.0; }
                return Math.max(1.0, Math.min(7.0, parseFloat(nota.toFixed(1))));
            };

            const obtenerNivelMineduc = (puntaje, pIdeal) => {
                if (pIdeal === 0 || puntaje === 0) return nivelesMineduc[0];
                const porcentaje = Math.round((puntaje / pIdeal) * 100);
                return nivelesMineduc.find(n => porcentaje <= n.max) || nivelesMineduc[0];
            };

            const handleAddAlumno = (e) => {

                        setAlumnosSeleccionados([...alumnosSeleccionados, nombre]);
                        setInputAlumno('');

                }

            const handleRemoveAlumno = (nombre) => {

                    setSeleccionesCotejo(res.selecciones || {});
                    setObservacionesCotejo(res.observaciones || {});
                } 
                else if (res.instrumentoData.tipo === 'escala') {
                    setEscalaIndicadores(res.instrumentoData.escalaIndicadores);
                    setEscalaColumnas(res.instrumentoData.escalaColumnas);
                    setEscalaActual(prev => ({...prev, titulo: res.instrumento}));
                    setSeleccionesEscala(res.selecciones || {});
                    setObservacionesEscala(res.observaciones || {});
                }

                setAlumnosSeleccionados([res.alumno]);
                setInputAlumno('');
                setRetroalimentacion(res.retroalimentacion || '');
                setEditingId(res.id);
                setActiveTab('evaluar');
                window.scrollTo(0,0);
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setAlumnosSeleccionados([]);
                setInputAlumno('');
                setRetroalimentacion('');
                setSeleccionesRubrica({});
                setSeleccionesCotejo({});
                setObservacionesCotejo({});
                setSeleccionesEscala({});
                setObservacionesEscala({});
            };

            const handleGuardarEvaluacion = (e, goToReport = true) => {
                if (e) e.preventDefault();
                
                let listaAEvaluar = [...alumnosSeleccionados];
                if (inputAlumno.trim() !== '' && !listaAEvaluar.includes(inputAlumno.trim())) {

                }

                if (listaAEvaluar.length === 0) {
                    alert("Por favor, añade al menos un estudiante para evaluar.");

                }

                let maximoAUsar = puntajeMaxRubrica;
                if (tipoInstrumento === 'cotejo') maximoAUsar = puntajeMaxCotejo;
                if (tipoInstrumento === 'escala') maximoAUsar = puntajeMaxEscala;

                const nota = calcularNota(puntajeObtenido, maximoAUsar, exigencia);
                const nivel = obtenerNivelMineduc(puntajeObtenido, maximoAUsar);
                const detallesEvaluacion = obtenerDetallesActuales();
                const tituloActual = tipoInstrumento === 'rubrica' ? rubricaActual.titulo : (tipoInstrumento === 'cotejo' ? cotejoActual.titulo : escalaActual.titulo);

                const currentSelecciones = tipoInstrumento === 'rubrica' ? seleccionesRubrica : (tipoInstrumento === 'cotejo' ? seleccionesCotejo : seleccionesEscala);
                const currentObservaciones = tipoInstrumento === 'cotejo' ? observacionesCotejo : (tipoInstrumento === 'escala' ? observacionesEscala : {});
                const currentInstrumentData = {
                    tipo: tipoInstrumento,
                    rubricaGrid: tipoInstrumento === 'rubrica' ? rubricaGrid : null,
                    cotejoIndicadores: tipoInstrumento === 'cotejo' ? cotejoIndicadores : null,
                    escalaIndicadores: tipoInstrumento === 'escala' ? escalaIndicadores : null,

                if (editingId) {
                    const indexToUpdate = resultados.findIndex(r => r.id === editingId);
                    if (indexToUpdate >= 0) {
                        const updatedResultados = [...resultados];
                        updatedResultados[indexToUpdate] = {
                            ...updatedResultados[indexToUpdate],
                            alumno: listaAEvaluar[0], 
                            curso: curriculumParams.curso,
                            exigencia: exigencia,

                setSeleccionesEscala({}); setObservacionesEscala({});

                }

                const file = e.target.files[0];

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = window.XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        if (jsonData.length > 0) {
                            const parsedHeaders = jsonData[0].map(h => h ? String(h).trim() : "");
                            const parsedRows = jsonData.slice(1).filter(row => row.length > 0 && row.some(c => c)).map(row => {
                                let newRow = row.map(c => c ? String(c).trim() : "");
                                while(newRow.length < parsedHeaders.length) newRow.push("");
                                return newRow.slice(0, parsedHeaders.length);

                            setRubricaGrid({ headers: parsedHeaders, rows: parsedRows });
                            setRubricaActual(prev => ({ ...prev, titulo: file.name.replace(/\.[^/.]+$/, ""), archivoCargado: true, nombreArchivo: file.name }));
                        } else { alert("El archivo parece estar vacío."); }
                    } catch (error) { alert("Error al leer el archivo. Asegúrate de que sea .csv o .xlsx"); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleFileUploadEstudiantes = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();

                        if (jsonData.length > 0) {

                            let colIndex = 0;
                            const keywords = ['nombre', 'estudiante', 'alumno', 'name'];
                            for (let i = 0; i < headerRow.length; i++) {

                                }
                            }

                                if (name && String(name).trim() !== '') {

                                }

                    e.target.value = null; 
                };
                reader.readAsArrayBuffer(file);
            };

                    case 'Nivel B': bgLvl = '#f0fdfa'; textLvl = '#0f766e'; borderLvl = '#99f6e4'; break;
                    case 'Nivel C': bgLvl = '#faf5ff'; textLvl = '#7e22ce'; borderLvl = '#e9d5ff'; break;

                }

                let planAcompanamientoHTML = res.nota < 4.0 ? `

            const agregarImagenAPDF = (pdf, imgData, canvasWidth, canvasHeight) => {
                const imgWidth = 210; // Ancho A4 en mm
                const pageHeight = 297; // Alto A4 en mm
                const imgHeight = (canvasHeight * imgWidth) / canvasWidth;
                
                let heightLeft = imgHeight;
                let position = 0;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft > 0) {
                    position = position - pageHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
            };

                                                    <button onClick={generarInsightsCursoIA} className="inline-flex items-center justify-center gap-2 bg-amber-50 text-amber-700 px-3 py-2 rounded-lg text-xs font-bold shadow-sm border border-amber-200 hover:bg-amber-100 transition-colors flex-1 sm:flex-none" title="Análisis automático de fortalezas y debilidades del curso">
                                                        <Sparkles size={16}/> ✨ Analizar Curso IA
                                                    </button>
                                                    <button onClick={exportarReporteExcel} className="inline-flex items-center justify-center gap-2 bg-emerald-50 text-emerald-700 px-3 py-2 rounded-lg text-xs font-bold shadow-sm border border-emerald-200 hover:bg-emerald-100 transition-colors flex-1 sm:flex-none" title="Resumen del curso en Excel">
                                                        <FileSpreadsheet size={16}/> Resumen Excel
                                                    </button>
                                                    <button onClick={generarPDFMasivo} className="inline-flex items-center justify-center gap-2 bg-red-50 text-red-700 px-3 py-2 rounded-lg text-xs font-bold shadow-sm border border-red-200 hover:bg-red-100 transition-colors flex-1 sm:flex-none" title="Todos los reportes PDF en un solo archivo">
                                                        <FileText size={16}/> Descargar Todos
                                                    </button>
                                                </div>
                                            )}
                                            <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                                <button onClick={handleOpenSaveSessionModal} className="inline-flex items-center justify-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-2 rounded-lg text-xs font-bold shadow-sm border border-indigo-200 hover:bg-indigo-100 transition-colors flex-1 sm:flex-none" title="Guardar estado actual para continuar después (.json)">
                                                    <Save size={16}/> Guardar Sesión
                                                </button>
                                                <button onClick={() => fileInputSesionRef.current.click()} className="inline-flex items-center justify-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-2 rounded-lg text-xs font-bold shadow-sm border border-indigo-200 hover:bg-indigo-100 transition-colors flex-1 sm:flex-none" title="Cargar sesión guardada previamente (.json)">
                                                    <Upload size={16}/> Cargar Sesión
                                                </button>
                                                <input type="file" accept=".json" ref={fileInputSesionRef} onChange={importarSesion} className="hidden" />
                                                <button onClick={() => confirm('¿Borrar historial de evaluaciones y vaciar el reporte?') && setResultados([])} className="text-neutral-400 hover:text-red-500 p-2 transition-colors rounded-lg hover:bg-red-50 shrink-0" title="Borrar historial">
                                                    <Trash2 size={18}/>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Modal Guardar Sesión */}
                                    {isSaveSessionModalOpen && (
                                        <div className="fixed inset-0 bg-neutral-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
                                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-indigo-900">
                                                    <Save size={20} className="text-indigo-600"/> Guardar Sesión de Evaluación
                                                </h3>
                                                <p className="text-sm text-neutral-500 mb-4 leading-relaxed">
                                                    Ponle un nombre a tu archivo de respaldo. <br/><br/>
                                                    <i>Nota: Si tu navegador está configurado para descargar automáticamente, el archivo irá directo a tu carpeta de "Descargas" con este nombre.</i>
                                                </p>
                                                <div className="mb-4">
                                                    <label className="block text-xs font-bold text-neutral-500 uppercase mb-1.5">Nombre del archivo</label>
                                                    <div className="flex items-center gap-2 bg-neutral-50 border border-neutral-300 rounded-lg p-1 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500 transition-shadow">
                                                        <input
                                                            type="text"
                                                            value={sessionFileName}
                                                            onChange={(e) => setSessionFileName(e.target.value)}
                                                            className="flex-1 bg-transparent p-2 outline-none text-sm font-semibold text-neutral-700"
                                                            autoFocus
                                                            placeholder="Ej: Evaluacion_4B_Musica"
                                                        />
                                                        <span className="text-neutral-400 text-sm font-bold pr-3">.json</span>
                                                    </div>
                                                </div>
                                                <div className="flex justify-end gap-3 mt-6">
                                                    <button onClick={() => setIsSaveSessionModalOpen(false)} className="px-4 py-2 text-neutral-500 font-bold hover:bg-neutral-100 rounded-lg transition-colors text-sm">
                                                        Cancelar
                                                    </button>
                                                    <button onClick={exportarSesionConfirmado} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition-colors shadow-md flex items-center gap-2 text-sm">
                                                        <FileDown size={16}/> Descargar
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Modal Insights de Curso IA */}
                                    {insightModalOpen && (
                                        <div className="fixed inset-0 bg-neutral-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 flex flex-col max-h-[90vh]">
                                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                                    <h3 className="font-bold text-lg text-amber-600 flex items-center gap-2"><Sparkles size={20}/> Reporte de Curso IA</h3>
                                                    <button onClick={() => setInsightModalOpen(false)} className="text-neutral-400 hover:text-neutral-700"><XIcon size={20}/></button>
                                                </div>
                                                <div className="overflow-y-auto flex-1 p-2">
                                                    {isGeneratingInsights ? (
                                                        <div className="flex flex-col items-center justify-center p-8 text-neutral-500 gap-4">
                                                            <Loader2 size={32} className="animate-spin text-amber-500" />
                                                            <p className="text-sm font-medium text-center whitespace-pre-line">{insightText}</p>
                                                        </div>
                                                    ) : (
                                                        <div className="text-sm text-neutral-700 leading-relaxed whitespace-pre-line">
                                                            {insightText}
                                                        </div>
                                                    )}
                                                </div>
                                                {!isGeneratingInsights && (
                                                    <div className="mt-4 pt-4 border-t border-neutral-100 text-right">
                                                        <button onClick={() => setInsightModalOpen(false)} className="px-4 py-2 bg-neutral-100 hover:bg-neutral-200 rounded-lg text-sm font-bold transition-colors">Cerrar Análisis</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {resultados.length > 0 ? (
                                        <div className="w-full">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-neutral-50 text-[10px] font-bold text-neutral-400 uppercase tracking-widest border-b border-neutral-200">
                                                        <SortableHeader label="Estudiante" sortKey="alumno" align="left" />
                                                        <SortableHeader label="Nivel" sortKey="nivel" />
                                                        <SortableHeader label="Puntaje" sortKey="puntaje" />
                                                        <SortableHeader label="Logro" sortKey="logro" />
                                                        <SortableHeader label="Nota" sortKey="nota" />
                                                        <th className="px-3 md:px-6 py-4 text-center">Acciones</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-neutral-100">
                                                    {sortedResultados.map((res) => (
                                                        <tr key={res.id} className="hover:bg-neutral-50/50 transition-colors">
                                                            <td className="px-3 md:px-6 py-4 md:py-5">
                                                                <div className="font-bold text-neutral-900 whitespace-nowrap">{res.alumno}</div>
                                                                <div className="text-[10px] text-neutral-400 italic mt-1 leading-tight">{res.fecha} • {res.instrumento}</div>
                                                                {res.retroalimentacion && <div className="text-[10px] text-indigo-500 font-semibold mt-1 flex items-center gap-1"><MessageSquare size={10} /> Feedback adjunto</div>}
                                                            </td>
                                                            <td className="px-3 md:px-6 py-4 md:py-5 text-center"><span className={`inline-block whitespace-nowrap px-3 py-1 rounded-full text-[10px] font-black uppercase ${res.colorNivel} ${res.textNivel} border border-current opacity-80`}>{res.nivel}</span></td>
                                                            <td className="px-3 md:px-6 py-4 md:py-5 text-center font-mono text-sm text-neutral-500">{res.puntaje}/{res.maximo}</td>
                                                            <td className="px-3 md:px-6 py-4 md:py-5 text-center font-bold text-neutral-600 text-sm">{res.maximo > 0 ? Math.round((res.puntaje / res.maximo) * 100) : 0}%</td>
                                                            <td className="px-3 md:px-6 py-4 md:py-5 text-center"><span className={`text-lg font-black ${res.nota >= 4 ? 'text-indigo-600' : 'text-red-500'}`}>{res.nota.toFixed(1)}</span></td>
                                                            <td className="px-3 md:px-6 py-4 md:py-5 text-center">
                                                                <div className="flex flex-wrap items-center justify-center gap-2">
                                                                    <button onClick={() => handleEditEvaluacion(res)} className="inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-colors border border-amber-200" title="Editar">
                                                                        <Edit3 size={14} /> 
                                                                    </button>
                                                                    <button onClick={() => generarPDF(res)} className="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-colors" title="Descargar PDF (Página Continua)">
                                                                        <FileDown size={14} /> PDF
                                                                    </button>
                                                                    <button onClick={() => generarJPG(res)} className="inline-flex items-center gap-1.5 bg-pink-50 text-pink-600 hover:bg-pink-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-colors" title="Descargar Imagen JPG">
                                                                        <FileImage size={14} /> JPG
                                                                    </button>
                                                                    <button onClick={() => setPreviewData(res)} className="inline-flex items-center gap-1.5 bg-cyan-50 text-cyan-600 hover:bg-cyan-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-colors" title="Previsualizar">
                                                                        <Eye size={14} /> 
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <div className="p-20 text-center"><div className="bg-neutral-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 border"><AlertCircle className="text-neutral-200" size={32} /></div><p className="text-neutral-400 text-sm">No hay evaluaciones registradas.</p></div>
                                    )}

                                    {/* Modal de Previsualización */}
                                    {previewData && (
                                        <div className="fixed inset-0 bg-neutral-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl flex flex-col max-h-[95vh] overflow-hidden">
                                                <div className="flex flex-wrap justify-between items-center p-4 border-b bg-neutral-50 shrink-0 gap-2">
                                                    <h3 className="font-bold text-lg flex items-center gap-2 text-neutral-800"><Eye size={20} className="text-cyan-600"/> Previsualización Oficial</h3>
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <button onClick={() => { generarPDF(previewData); setPreviewData(null); }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center gap-2">
                                                            <FileDown size={16} /> PDF
                                                        </button>
                                                        <button onClick={() => { generarJPG(previewData); setPreviewData(null); }} className="bg-pink-600 hover:bg-pink-700 text-white px-3 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center gap-2">
                                                            <FileImage size={16} /> JPG
                                                        </button>
                                                        <button onClick={() => setPreviewData(null)} className="text-neutral-400 hover:text-neutral-700 bg-white hover:bg-neutral-200 rounded-full p-2 border shadow-sm transition-colors">
                                                            <XIcon size={18}/>
                                                        </button>
                                                    </div>
                                                </div>
                                                {/* Contenedor con overflow que respeta el tamaño exacto del lienzo */}
                                                <div className="flex-1 overflow-auto p-4 md:p-8 bg-neutral-300 flex justify-center items-start w-full">
                                                    <div 
                                                        className="bg-white shadow-2xl shrink-0 rounded-sm" 
                                                        style={{ width: '800px', boxSizing: 'content-box' }} 
                                                    >
                                                        <div dangerouslySetInnerHTML={{ __html: getReporteHTML(previewData) }}></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
