            try {

                const a = document.createElement("a");
                a.style.display = "none";
                a.href = url;
                a.download = nombre;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 150);

            }

                }

            };

                if (sortConfig !== null && sortConfig.key) {

                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];
                        
                        if (sortConfig.key === 'logro') {
                            aValue = a.maximo > 0 ? (a.puntaje / a.maximo) : 0;
                            bValue = b.maximo > 0 ? (b.puntaje / b.maximo) : 0;
                        } else if (typeof aValue === 'string') {
                            aValue = aValue.toLowerCase();
                            bValue = (bValue || '').toLowerCase();
                        }

                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });

                const envApiKey = ""; 
                const userApiKey = safeStorage.getItem('gemini_api_key');
                const activeKey = userApiKey || envApiKey;
                const modelName = userApiKey ? "gemini-2.5-flash" : "gemini-2.5-flash-preview-09-2025";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;
                
                let reqBody = {
                    contents: [{ parts: [{ text: promptTexto }] }],
                    systemInstruction: { parts: [{ text: instruccionSistema }] }
                };

                if (forceJSON) {
                    reqBody.generationConfig = { responseMimeType: "application/json" };
                }
                
                let response;
                for (let i = 0; i < 5; i++) {
                    try {
                        response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(reqBody)
                        });
                        if (response.ok) break;
                        if (response.status === 400 || response.status === 403 || response.status === 404) break; 
                    } catch (e) {
                        if (i === 4) throw e;
                        await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                    }
                }
                
                if (!response || !response.ok) {
                    let errorMsg = "Error desconocido";
                    try {
                        const errData = await response.json();
                        errorMsg = errData.error?.message || JSON.stringify(errData);
                    } catch(e) {
                        errorMsg = response ? await response.text() : "Fallo de red al intentar conectar";
                    }
                    console.error("Error de API:", errorMsg);
                    throw new Error(`Error al conectar con la API de IA: ${errorMsg}`);
                }
                
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            };

                    if (matchArray) {
                        try { return JSON.parse(matchArray[0]); } catch (e2) {}
                    }
                    const matchObj = text.match(/\{[\s\S]*\}/);

                    return null;

                const p = parseFloat(puntaje) || 0;
                const pi = parseFloat(pIdeal) || 1;
                const ex = parseFloat(exig) || 60;
                const pCorte = pi * (ex / 100);

                let nota;
                if (p < pCorte) { nota = (4.0 - 1.0) * (p / (pCorte || 1)) + 1.0; } 
                else { nota = (7.0 - 4.0) * ((p - pCorte) / ((pi - pCorte) || 1)) + 4.0; }
                return Math.max(1.0, Math.min(7.0, parseFloat(nota.toFixed(1))));

                let position = 0;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft > 0) {
                    position = position - pageHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }

                    } catch (error) {

                                                <button onClick={generarInsightsCursoIA} disabled={resultados.length === 0 || isGeneratingInsights} className="bg-amber-100 hover:bg-amber-200 text-amber-800 disabled:opacity-50 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors shadow-sm border border-amber-200">{isGeneratingInsights ? <Loader2 size={16} className="animate-spin"/> : <Sparkles size={16} />} {isGeneratingInsights ? 'Analizando...' : 'Análisis IA del Curso'}</button>
                                                <button onClick={exportarReporteExcel} disabled={resultados.length === 0} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 disabled:opacity-50 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors shadow-sm border border-emerald-200"><FileSpreadsheet size={18} /> Exportar Notas (Excel)</button>
                                                <button onClick={generarPDFMasivo} disabled={resultados.length === 0} className="bg-indigo-600 hover:bg-indigo-700 text-white disabled:opacity-50 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-colors shadow-md"><FileText size={18} /> Descargar Todos (PDF)</button>
                                            </div>
                                        </div>

                                        {resultados.length === 0 ? (
                                            <div className="text-center py-20 bg-neutral-50 rounded-2xl border-2 border-dashed border-neutral-200"><BarChart3 size={48} className="mx-auto text-neutral-300 mb-4" /><p className="text-lg font-bold text-neutral-500 mb-1">No hay evaluaciones registradas</p><p className="text-sm text-neutral-400">Ve a la pestaña "Evaluar Alumnos" para comenzar.</p></div>
                                        ) : (
                                            <div className="border border-neutral-200 rounded-xl overflow-hidden shadow-sm">
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                                        <thead className="bg-neutral-50 border-b">
                                                            <tr>
                                                                <SortableHeader label="Estudiante" sortKey="alumno" align="left" />
                                                                <SortableHeader label="Instrumento" sortKey="instrumento" align="left" />
                                                                <SortableHeader label="Tipo" sortKey="tipoInstrumento" />
                                                                <SortableHeader label="Logro" sortKey="logro" />
                                                                <SortableHeader label="Nota" sortKey="nota" />
                                                                <SortableHeader label="Nivel Mineduc" sortKey="nivel" />
                                                                <th className="px-6 py-4 text-center text-xs font-bold text-neutral-500 uppercase tracking-wider">Acciones</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {sortedResultados.map((res, index) => {
                                                                const logro = res.maximo > 0 ? Math.round((res.puntaje / res.maximo) * 100) : 0;
                                                                return (
                                                                    <tr key={res.id} className="border-b last:border-b-0 hover:bg-neutral-50 transition-colors group">
                                                                        <td className="px-6 py-4 font-bold text-neutral-800"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs">{res.alumno.charAt(0).toUpperCase()}</div>{res.alumno}</div></td>
                                                                        <td className="px-6 py-4 text-sm text-neutral-600 max-w-[200px] truncate" title={res.instrumento}>{res.instrumento}</td>
                                                                        <td className="px-6 py-4 text-center"><span className="bg-neutral-100 text-neutral-600 px-2 py-1 rounded text-xs font-bold border border-neutral-200">{res.tipoInstrumento === 'rubrica' ? 'Rúbrica' : (res.tipoInstrumento === 'cotejo' ? 'Cotejo' : 'Escala')}</span></td>
                                                                        <td className="px-6 py-4 text-center"><div className="flex items-center justify-center gap-2"><div className="w-16 h-2 bg-neutral-200 rounded-full overflow-hidden"><div className="h-full bg-indigo-500" style={{width: `${logro}%`}}></div></div><span className="text-sm font-bold text-neutral-700 w-8">{logro}%</span></div></td>
                                                                        <td className="px-6 py-4 text-center"><span className={`inline-block px-3 py-1 rounded-lg text-sm font-black ${res.nota >= 4.0 ? 'bg-indigo-100 text-indigo-700' : 'bg-red-100 text-red-700'}`}>{res.nota.toFixed(1)}</span></td>
                                                                        <td className="px-6 py-4 text-center"><span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${res.colorNivel} ${res.textNivel} border-current border-opacity-20`}>{res.nivel}</span></td>
                                                                        <td className="px-6 py-4">
                                                                            <div className="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                                <button onClick={() => setPreviewData(res)} className="p-2 text-neutral-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="Vista Previa"><Eye size={18} /></button>
                                                                                <button onClick={() => handleEditEvaluacion(res)} className="p-2 text-neutral-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors" title="Editar"><Edit3 size={18} /></button>
                                                                                <div className="relative group/dl">
                                                                                    <button className="p-2 text-neutral-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors" title="Descargar"><FileDown size={18} /></button>
                                                                                    <div className="absolute right-0 top-full mt-1 bg-white border shadow-lg rounded-lg overflow-hidden hidden group-hover/dl:block z-50">
                                                                                        <button onClick={() => generarPDF(res)} className="block w-full text-left px-4 py-2 text-xs font-bold text-neutral-600 hover:bg-neutral-50 hover:text-indigo-600">PDF (.pdf)</button>
                                                                                        <button onClick={() => generarJPG(res)} className="block w-full text-left px-4 py-2 text-xs font-bold text-neutral-600 hover:bg-neutral-50 hover:text-indigo-600">Imagen (.jpg)</button>
                                                                                    </div>
                                                                                </div>
                                                                                <button onClick={() => { customConfirm(`¿Eliminar evaluación de ${res.alumno}?`, () => setResultados(resultados.filter(r => r.id !== res.id))) }} className="p-2 text-neutral-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Eliminar"><Trash2 size={18} /></button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                                <div className="bg-neutral-50 p-4 border-t border-neutral-200 text-xs text-neutral-500 font-medium flex justify-between"><span>Total evaluados: {resultados.length}</span><span>Promedio del curso: {(resultados.reduce((acc, r) => acc + r.nota, 0) / resultados.length).toFixed(1)}</span></div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Modal Vista Previa Individual */}
                            {previewData && (
                                <div className="fixed inset-0 bg-neutral-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden animate-in zoom-in-95">
                                        <div className="bg-neutral-100 p-4 flex justify-between items-center border-b shrink-0">
                                            <div className="flex items-center gap-3"><span className="bg-indigo-600 text-white p-1.5 rounded-lg"><Eye size={20}/></span><h3 className="font-bold text-lg">Vista Previa del Reporte</h3></div>
                                            <div className="flex gap-2">
                                                <button onClick={() => generarPDF(previewData)} className="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1 hover:bg-indigo-700 transition-colors"><FileDown size={16}/> Descargar PDF</button>
                                                <button onClick={() => setPreviewData(null)} className="bg-white border text-neutral-600 hover:bg-neutral-50 px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1 transition-colors"><XIcon size={16}/> Cerrar</button>
                                            </div>
                                        </div>
                                        <div className="p-6 overflow-y-auto bg-neutral-200/50 flex justify-center">
                                            <div className="bg-white shadow-md w-full max-w-3xl" dangerouslySetInnerHTML={{ __html: getReporteHTML(previewData) }} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- FIRMA / FOOTER --- */}
                            <div className="mt-auto pt-16 pb-2 text-center w-full opacity-60 hover:opacity-100 transition-opacity">
                                <p className="text-[11px] font-medium text-neutral-400 select-none tracking-wide">
                                    Creado por el profesor <span className="font-bold">Victor Acevedo C.</span>
                                </p>
                            </div>

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
